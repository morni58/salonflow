# ═══════════════════════════════════════════════════
# SalonFlow — Netlify Configuration
# ═══════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── API Proxy (MUST be ABOVE SPA fallback) ───────
# Netlify processes redirects top-to-bottom.
# /api/* must resolve to backend BEFORE the catch-all.

[[redirects]]
  from = "/api/*"
  to = "https://salonflow-api-568278480287.europe-west1.run.app/api/:splat"
  status = 200
  force = true

# ─── SPA Fallback ─────────────────────────────────
# All other routes serve index.html (React Router)

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Security Headers ─────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ─── Cache static assets forever (Vite hashes filenames) ──

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Cache fonts ──────────────────────────────────

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
